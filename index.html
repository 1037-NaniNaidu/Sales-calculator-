<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">

    <title>Sales Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <!-- ================================
         COMBINED SALES CALCULATOR
    ================================= -->

    <header>
        <h1>Sales Calculator</h1>
        <p>Enter your sales once and track them automatically.</p>
    </header>


    <section class="card">

        <h2>Sales Calculator</h2>

        <!-- COST -->

        <label for="cost">
            Cost per stock (₹)
        </label>

        <input
            id="cost"
            type="number"
            min="0"
            step="0.01"
            placeholder="Enter cost per stock"
        >


        <!-- CURRENT DAY -->

        <h3 id="currentDay">
            Sales Day 1
        </h3>


        <!-- SINGLE SALES INPUT -->

        <label for="quantity">
            Stocks Sold
        </label>

        <input
            id="quantity"
            type="number"
            min="1"
            step="1"
            placeholder="Enter stocks sold"
        >


        <button id="addSale">
            Add Sale
        </button>


        <!-- TODAY'S CALCULATION -->

        <div class="daily-total">

            <h3>Today's Total</h3>

            <p id="todayTotal">
                0 stocks = ₹0.00
            </p>

        </div>

    </section>


    <!-- ================================
         AUTOMATIC REAL-TIME TRACKER
    ================================= -->

    <section class="card">

        <h2>Real-Time Sales Tracker</h2>

        <p>
            Your sales are automatically transferred here.
        </p>


        <div id="salesHistory">

            <p>
                No sales recorded yet.
            </p>

        </div>


        <!-- GRAND TOTAL -->

        <div
            id="grandTotal"
            class="grand-total"
        >

            <h2>Grand Total</h2>

            <p>
                0 stocks = ₹0.00
            </p>

        </div>

    </section>


    <!-- ================================
         CLEAR
    ================================= -->

    <button
        id="clearSales"
        class="secondary"
    >
        Clear All Sales
    </button>

</main>


<script src="script.js"></script>

</body>
</html>
