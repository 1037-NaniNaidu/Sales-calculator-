<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Sales Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #17212b;
        }

        .app {
            width: min(100% - 24px, 620px);
            margin: 0 auto;
            padding: 20px 0;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .customer-button {
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .customer-button:hover {
            background: #f5f5f5;
        }

        .primary {
            width: 100%;
            background: #1565c0;
            color: white;
            margin-bottom: 15px;
        }

        .secondary {
            background: #607d8b;
            color: white;
        }

        .danger {
            background: #d32f2f;
            color: white;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row button {
            flex: 1;
        }

        .sale-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>

<body>

<main class="app">

    <!-- CUSTOMER SCREEN -->
    <section id="customerScreen">

        <h1>Store Sales Manager</h1>

        <button id="addCustomer" class="primary">
            + Add Customer
        </button>

        <div id="customerList"></div>

    </section>


    <!-- CUSTOMER MENU -->
    <section id="customerMenu" class="hidden">

        <div class="row">
            <button id="backButton" class="secondary">
                ← Back
            </button>
        </div>

        <br>

        <div class="card">
            <h2 id="customerName"></h2>

            <p>
                Today's Sales:
                ₹<span id="daySales">0</span>
            </p>

            <p>
                Total Sales:
                ₹<span id="totalSales">0</span>
            </p>
        </div>


        <div class="card">

            <h3>Add Product</h3>

            <input
                type="text"
                id="productName"
                placeholder="Product name"
            >

            <input
                type="number"
                id="productCost"
                placeholder="Cost"
                min="0"
            >

            <button id="addProduct" class="primary">
                Add Product
            </button>

        </div>


        <div class="card">

            <h3>Sales</h3>

            <div id="salesList"></div>

        </div>

    </section>


    <!-- ADD CUSTOMER FORM -->
    <section id="customerForm" class="hidden">

        <div class="card">

            <h2>Add Customer</h2>

            <input
                type="text"
                id="newCustomerName"
                placeholder="Customer name"
            >

            <div class="row">

                <button id="saveCustomer" class="primary">
                    Save
                </button>

                <button id="cancelCustomer" class="secondary">
                    Cancel
                </button>

            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
