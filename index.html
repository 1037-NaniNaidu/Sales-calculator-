<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <title>Store Sales Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header>
        <h1>Store Sales Manager</h1>
        <p>Manage customers and daily sales.</p>
    </header>

    <!-- CUSTOMER LIST SCREEN -->
    <section id="customerScreen">

        <section class="card">

            <h2>👥 Customers</h2>

            <button type="button" id="addCustomer">
                ➕ Add Customer
            </button>

            <div id="customerList">
                <p>No customers added yet.</p>
            </div>

        </section>

    </section>


    <!-- CUSTOMER MENU SCREEN -->
    <section id="customerMenu" class="hidden">

        <section class="card">

            <button type="button" id="backToCustomers" class="secondary">
                ← Back to Customers
            </button>

            <h2 id="customerTitle">
                Customer
            </h2>

        </section>


        <!-- ADD PRODUCT -->
        <section class="card">

            <h2>📦 Add Product</h2>

            <label for="productName">
                Product Name
            </label>

            <input
                id="productName"
                type="text"
                placeholder="Example: Fish"
            >

            <label for="productPrice">
                Cost (₹)
            </label>

            <input
                id="productPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="Enter cost"
            >

            <button type="button" id="addProduct">
                ➕ Add Product
            </button>

            <div id="productList">
                <p>No products added yet.</p>
            </div>

        </section>


        <!-- ADD SALE -->
        <section class="card">

            <h2>🧾 Add Sale</h2>

            <p id="currentDay"></p>

            <label for="saleProduct">
                Product
            </label>

            <select id="saleProduct">
                <option value="">Select Product</option>
            </select>

            <p id="selectedPrice">
                Price: ₹0.00
            </p>

            <label for="saleQuantity">
                Quantity
            </label>

            <input
                id="saleQuantity"
                type="number"
                min="1"
                step="1"
                placeholder="Enter quantity"
            >

            <p id="saleAmount">
                Sale Amount: ₹0.00
            </p>

            <button type="button" id="addSale">
                ➕ Add Sale
            </button>

        </section>


        <!-- DAY SALES -->
        <section class="card">

            <h2>📅 Day Sales</h2>

            <div id="daySales">
                <p>₹0.00</p>
            </div>

        </section>


        <!-- TOTAL SALES -->
        <section class="card result">

            <h2>💰 Total Sales</h2>

            <div id="totalSales">
                <p class="total">₹0.00</p>
            </div>

        </section>


        <!-- SALES HISTORY -->
        <section class="card">

            <h2>📊 Sales History</h2>

            <div id="salesHistory">
                <p>No sales recorded yet.</p>
            </div>

        </section>


        <!-- PRINT -->
        <section class="card">

            <button type="button" id="printSales">
                🖨️ Print Sales Details
            </button>

        </section>

    </section>

</main>

<script src="script.js?v=3"></script>

</body>
</html>
