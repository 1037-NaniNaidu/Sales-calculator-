<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <title>Sales Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

    <header>
        <h1>Sales Calculator</h1>
        <p>Enter each sale once and track all daily sales automatically.</p>
    </header>


    <!-- =========================================
         COMBINED SALES CALCULATOR
    ========================================== -->

    <section class="card">

        <h2>Sales Calculator</h2>

        <label for="cost">
            Cost per stock (₹)
        </label>

        <input
            id="cost"
            type="number"
            min="0"
            step="0.01"
            placeholder="e.g. 50"
        >


        <h3 id="currentDay">
            Sales Day 1
        </h3>


        <label for="quantity">
            Stocks Sold
        </label>

        <input
            id="quantity"
            type="number"
            min="1"
            step="1"
            placeholder="Enter stocks sold"
        >


        <button id="addSale">
            Add Sale
        </button>


        <div class="daily-total">

            <h3>Today's Total</h3>

            <p id="todayTotal">
                0 stocks = ₹0.00
            </p>

        </div>

    </section>


    <!-- =========================================
         AUTOMATIC REAL-TIME SALES TRACKER
    ========================================== -->

    <section class="card">

        <h2>Real-Time Sales Tracker</h2>

        <p>
            Sales entered above are automatically recorded here.
        </p>


        <div id="salesHistory">

            <p>
                No sales recorded yet.
            </p>

        </div>


        <!-- GRAND TOTAL -->

        <div id="grandTotal" class="grand-total">

            <h2>Grand Total</h2>

            <p>
                0 stocks = ₹0.00
            </p>

        </div>

    </section>


    <!-- =========================================
         CLEAR SALES
    ========================================== -->

    <button
        id="clearSales"
        class="secondary">
        Clear All Sales
    </button>

</main>


<script src="script.js"></script>

</body>
</html>
