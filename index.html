<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Store Sales Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #17212b;
        }

        .app {
            width: min(100% - 24px, 700px);
            margin: auto;
            padding: 20px 0;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        .card {
            background: white;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .primary {
            background: #1565c0;
            color: white;
        }

        .secondary {
            background: #607d8b;
            color: white;
        }

        .customer-button {
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .customer-button:hover {
            background: #f5f5f5;
        }

        .hidden {
            display: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row button {
            flex: 1;
        }

        .summary {
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            border-collapse: collapse;
            min-width: 100%;
            background: white;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #e8eef5;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media print {

            body {
                background: white;
            }

            .app {
                width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .card {
                box-shadow: none;
                border: none;
            }

            .table-container {
                overflow: visible;
            }

            table {
                font-size: 12px;
            }

            h1 {
                font-size: 22px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<main class="app">

    <!-- ============================= -->
    <!-- CUSTOMER LIST -->
    <!-- ============================= -->

    <section id="customerScreen">

        <h1>Store Sales Manager</h1>

        <button id="addCustomer" class="primary no-print">
            + Add Customer
        </button>

        <br><br>

        <div id="customerList"></div>

    </section>


    <!-- ============================= -->
    <!-- ADD CUSTOMER -->
    <!-- ============================= -->

    <section id="customerForm" class="hidden">

        <div class="card">

            <h2>Add Customer</h2>

            <input
                type="text"
                id="newCustomerName"
                placeholder="Customer name"
            >

            <div class="row">

                <button id="saveCustomer" class="primary">
                    Save
                </button>

                <button id="cancelCustomer" class="secondary">
                    Cancel
                </button>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- CUSTOMER SECTION -->
    <!-- ============================= -->

    <section id="customerMenu" class="hidden">

        <div class="no-print">

            <button id="backButton" class="secondary">
                ← Back
            </button>

        </div>

        <br>

        <div class="card">

            <h2 id="customerName"></h2>

            <div class="summary">
                Today's Total Sales:
                ₹<span id="daySales">0.00</span>
            </div>

            <div class="summary">
                All-Days Total Sales:
                ₹<span id="allDaysSales">0.00</span>
            </div>

        </div>


        <!-- ============================= -->
        <!-- ONE INPUT AREA -->
        <!-- ============================= -->

        <div class="card no-print">

            <h3>Add Product</h3>

            <label>Product</label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
            >

            <label>Cost</label>

            <input
                type="number"
                id="productCost"
                placeholder="Enter cost"
                min="0"
                step="0.01"
            >

            <label>Quantity</label>

            <input
                type="number"
                id="productQuantity"
                placeholder="Enter quantity"
                min="1"
                step="1"
            >

            <button id="addProduct" class="primary">
                Add Product
            </button>

        </div>


        <!-- ============================= -->
        <!-- SALES TABLE -->
        <!-- ============================= -->

        <div class="card">

            <h3>Sales</h3>

            <div id="salesTableContainer"></div>

        </div>


        <!-- ============================= -->
        <!-- PRINT -->
        <!-- ============================= -->

        <div class="card no-print">

            <button id="printSales" class="primary">
                🖨 Print All-Days Sales
            </button>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
