<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Sales Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #17212b;
        }

        .app {
            width: min(100% - 24px, 1000px);
            margin: auto;
            padding: 20px 0;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .card {
            background: white;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .primary {
            background: #1565c0;
            color: white;
        }

        .secondary {
            background: #607d8b;
            color: white;
        }

        .customer-button {
            width: 100%;
            text-align: left;
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        label {
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row button {
            flex: 1;
        }

        .hidden {
            display: none;
        }

        .total-box {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 900px;
            background: white;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 9px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #e5edf5;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .print-title {
            display: none;
        }

        @media print {

            body {
                background: white;
            }

            .app {
                width: 100%;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .print-title {
                display: block;
                text-align: center;
            }

            .card {
                box-shadow: none;
                padding: 5px;
            }

            .table-container {
                overflow: visible;
            }

            table {
                min-width: 0;
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<main class="app">

    <!-- ==============================
         CUSTOMER LIST
         ============================== -->

    <section id="customerScreen">

        <h1>Store Sales Manager</h1>

        <button id="addCustomer" class="primary no-print">
            + Add Customer
        </button>

        <br><br>

        <div id="customerList"></div>

    </section>


    <!-- ==============================
         ADD CUSTOMER
         ============================== -->

    <section id="customerForm" class="hidden">

        <div class="card">

            <h2>Add Customer</h2>

            <input
                id="newCustomerName"
                type="text"
                placeholder="Customer name"
            >

            <div class="row">

                <button id="saveCustomer" class="primary">
                    Save
                </button>

                <button id="cancelCustomer" class="secondary">
                    Cancel
                </button>

            </div>

        </div>

    </section>


    <!-- ==============================
         CUSTOMER SECTION
         ============================== -->

    <section id="customerMenu" class="hidden">

        <button
            id="backButton"
            class="secondary no-print"
        >
            ← Back
        </button>

        <br><br>

        <div class="print-title">
            <h1 id="printCustomerName"></h1>
            <h3>All-Days Sales</h3>
        </div>


        <!-- ==========================
             PRODUCT INPUT
             ========================== -->

        <div class="card">

            <h2 id="customerName"></h2>

            <h3>1. Add Product</h3>

            <label for="productName">
                Product
            </label>

            <input
                id="productName"
                type="text"
                list="productSuggestions"
                placeholder="Enter product name"
                autocomplete="off"
            >

            <datalist id="productSuggestions"></datalist>


            <label for="productCost">
                Cost
            </label>

            <input
                id="productCost"
                type="number"
                min="0"
                step="0.01"
                placeholder="Cost"
            >


            <label for="productQuantity">
                Quantity
            </label>

            <input
                id="productQuantity"
                type="number"
                min="1"
                step="1"
                placeholder="Quantity"
            >


            <!-- MONTH -->

            <label for="saleMonth">
                Month
            </label>

            <select id="saleMonth">

                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>

            </select>


            <!-- DAY -->

            <label for="saleDay">
                Day Number
            </label>

            <input
                id="saleDay"
                type="number"
                min="1"
                max="31"
                placeholder="Enter day number"
            >


            <button
                id="addProduct"
                class="primary no-print"
            >
                Add Product
            </button>

            <div
                id="productMessage"
                class="message no-print"
            ></div>

        </div>


        <!-- ==========================
             TOTALS
             ========================== -->

        <div class="card">

            <h3>4. Total Sales of Selected Day</h3>

            <div class="total-box">
                ₹<span id="daySales">0.00</span>
            </div>


            <h3>5. Total Sales of All Days</h3>

            <div class="total-box">
                ₹<span id="allDaysSales">0.00</span>
            </div>

        </div>


        <!-- ==========================
             PRINT
             ========================== -->

        <div class="card no-print">

            <button
                id="printSales"
                class="primary"
            >
                🖨 Print All-Days Sales
            </button>

        </div>


        <!-- ==========================
             SALES TABLE
             ========================== -->

        <div class="card">

            <h3>Sales History</h3>

            <div id="salesTableContainer"></div>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
